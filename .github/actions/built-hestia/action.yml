name: built hestia
description: Import the hestia closure the build job exported, as ./hestia-bin (and ./gha-real-tests on Linux).
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v5
      with:
        name: hestia-${{ runner.os }}
    - shell: bash
      run: |
        set -euo pipefail
        nix-store --import < hestia-closure.nar > /dev/null
        ln -sfn "$(sed -n 1p hestia-closure.paths)" hestia-bin
        if [ -n "$(sed -n 2p hestia-closure.paths)" ]; then
          ln -sfn "$(sed -n 2p hestia-closure.paths)" gha-real-tests
        fi
        rm hestia-closure.nar hestia-closure.paths
